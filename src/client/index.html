<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interpreter Workbench</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Interpreter Workbench</h1>
      <p id="vendors" class="muted">Loading vendors…</p>
    </header>

    <section class="controls" aria-label="Controls">
      <button id="start" type="button" class="primary">Start</button>
      <fieldset>
        <legend>Mode</legend>
        <label><input type="radio" name="mode" value="realtime" checked /> Voice-to-voice</label>
        <label><input type="radio" name="mode" value="cascade" /> Cascade</label>
      </fieldset>
      <label>
        Language pair
        <select id="pair">
          <option value="en-es">English ↔ Spanish</option>
        </select>
      </label>
      <label><input type="checkbox" id="headphones" /> I'm wearing headphones</label>
      <button id="eval" type="button">Run eval</button>
    </section>
    <p class="hint">
      Use headphones for the best results. Without them, the microphone is muted while the interpreter speaks,
      so you cannot interrupt it.
    </p>
    <p id="status" role="status" aria-live="polite"></p>

    <main>
      <section class="pane" aria-labelledby="src-h">
        <h2 id="src-h">Source (heard)</h2>
        <ol id="src" class="turns"></ol>
      </section>
      <section class="pane" aria-labelledby="tgt-h">
        <h2 id="tgt-h">Target (interpreted)</h2>
        <ol id="tgt" class="turns"></ol>
      </section>
      <section class="pane timing" aria-labelledby="timing-h">
        <h2 id="timing-h">Timing per turn</h2>
        <ol id="timing" class="turns"></ol>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
